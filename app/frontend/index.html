<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The server replaces the content below with the session token. The client uses the first meta with a real value. -->
<meta name="monitor-token" content="__MONITOR_TOKEN__">
<title>Loop Harness</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles/base.css">
<link rel="stylesheet" href="/static/styles/panel.css">
<link rel="stylesheet" href="/static/styles/components.css">
<link rel="stylesheet" href="/static/styles/hub.css">
</head>
<body>
<div id="root"><noscript>This panel needs JavaScript.</noscript></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- ===================== HUB (/) ===================== -->
<template id="tpl-hub">
  <div id="hub" class="hub">
    <div id="banner-offline" class="banner banner-offline" role="alert" hidden>
      <span class="dot dot-red"></span>
      <strong>app disconnected</strong>
      <span id="banner-offline-detail"></span>
    </div>
    <header class="header hub-header">
      <div class="brand">
        <div class="logo" aria-hidden="true">L</div>
        <div>
          <div class="brand-name">Loop Harness</div>
          <div class="brand-sub mono">projects</div>
        </div>
      </div>
      <div class="spacer"></div>
      <span id="hub-help"></span>
    </header>

    <main class="hub-main">
      <section class="hub-start" aria-labelledby="hub-title">
        <h1 id="hub-title" class="hub-h1">Projects</h1>
        <p class="muted hub-lead">Open a project folder (new, existing without .specs, or with a loop stopped midway) or create a new one. Each project panel shows where it stands and what the next step is.</p>
        <div class="hub-buttons">
          <button type="button" class="btn btn-primary hub-big" id="hub-open">Open folder</button>
          <button type="button" class="btn hub-big" id="hub-create">Create project from scratch</button>
          <button type="button" class="btn btn-ghost btn-sm" id="hub-browse" title="in-app folder browser, without the system window">Browse folders</button>
        </div>
        <form class="hub-paste" id="hub-paste" aria-label="Open by path">
          <label for="hub-paste-field" class="hint">or paste the path:</label>
          <input type="text" id="hub-paste-field" class="mono" placeholder="C:\Users\you\projects\my-app" autocomplete="off" spellcheck="false">
          <button type="submit" class="btn btn-sm">Open</button>
        </form>
        <div id="hub-opening" class="hub-opening" hidden></div>
      </section>

      <section class="hub-recent" aria-labelledby="hub-recent-t">
        <div class="sec-head"><h2 class="sec-title" id="hub-recent-t">Recent <span class="dim-mono" id="hub-total"></span></h2></div>
        <div id="hub-list"></div>
      </section>
    </main>

    <footer class="hub-footer" aria-label="App diagnostics">
      <div class="hub-footer-t">
        <span class="small-label">Diagnostics</span>
        <button type="button" class="btn btn-sm" id="hub-test">Test notification</button>
        <span class="spacer"></span>
        <div id="hub-shutdown"></div>
      </div>
      <div id="hub-diag"></div>
    </footer>

    <div id="closed" class="closed" hidden>
      <div class="closed-card" role="alert">
        <div class="closed-title">App shut down</div>
        <div class="muted">The server was shut down. You can close this tab. Loops already started keep running.</div>
      </div>
    </div>
  </div>
</template>

<!-- ===================== PANEL (/p/<id>/) ===================== -->
<template id="tpl-panel">
  <div id="app">
    <div id="banner-offline" class="banner banner-offline" role="alert" hidden>
      <span class="dot dot-red"></span>
      <strong>app disconnected</strong>
      <span id="banner-offline-detail"></span>
    </div>

    <header id="header" class="header">
      <div class="brand">
        <a class="logo logo-link" href="/" title="back to the projects" aria-label="back to the projects">L</a>
        <div>
          <div class="brand-name"><a href="/" class="brand-link">Loop Harness</a></div>
          <div class="brand-sub mono" id="brand-sub">—</div>
        </div>
      </div>
      <div class="pill" id="status-pill" role="status" aria-live="polite">
        <span class="dot" id="status-dot"></span>
        <span class="mono" id="status-text">connecting…</span>
      </div>
      <div class="limits" id="limits" aria-label="Loop limits"></div>
      <div class="spacer"></div>
      <div class="header-actions" id="header-actions"></div>
      <div class="header-actions" id="header-extra"></div>
    </header>

    <div id="trail" class="trail" aria-label="Where this project stands"></div>
    <div id="alert-zone" class="alert-zone"></div>
    <div id="newloop-zone" class="newloop-zone" hidden></div>

    <main class="main">
      <aside class="left" id="left" aria-label="Roadmap"></aside>
      <div class="sep sep-v" id="sep-left" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Roadmap width" title="drag, use the arrows or double-click to restore"></div>

      <section class="center" id="center" aria-label="Loop view">
        <div class="center-bar">
          <button type="button" class="btn btn-sm left-toggle" id="left-toggle" aria-expanded="false" aria-controls="left">Roadmap</button>
          <div class="seg" role="tablist" aria-label="View" id="center-tabs">
            <button type="button" role="tab" id="tab-turn" class="seg-btn" aria-selected="true">Current turn</button>
            <button type="button" role="tab" id="tab-hist" class="seg-btn" aria-selected="false" tabindex="-1">History</button>
            <button type="button" role="tab" id="tab-deps" class="seg-btn" aria-selected="false" tabindex="-1">Dependencies</button>
            <button type="button" role="tab" id="tab-files" class="seg-btn" aria-selected="false" tabindex="-1">Files</button>
            <button type="button" role="tab" id="tab-board" class="seg-btn" aria-selected="false" tabindex="-1">Whiteboard</button>
          </div>
          <div class="caption" id="caption"></div>
          <div class="zoom-ctl" id="zoom-ctl" role="group" aria-label="Diagram zoom">
            <button type="button" class="btn btn-sm btn-ghost" id="zoom-out" title="zoom out (Ctrl + scroll)" aria-label="zoom out">−</button>
            <span class="zoom-val mono" id="zoom-val">100%</span>
            <button type="button" class="btn btn-sm btn-ghost" id="zoom-in" title="zoom in (Ctrl + scroll)" aria-label="zoom in">+</button>
            <button type="button" class="btn btn-sm btn-ghost" id="zoom-fit" title="fits and centers the diagram">Center</button>
          </div>
        </div>
        <div id="past-bar" class="past-bar" hidden></div>
        <div class="canvas-wrap">
          <div class="canvas" id="canvas"></div>
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <div class="sep sep-v" id="sep-right" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Inspector width" title="drag, use the arrows or double-click to restore"></div>
      <aside class="right" aria-label="Inspector">
        <div class="insp-head" id="insp-head"></div>
        <div class="insp-tabs" id="insp-tabs" role="tablist" aria-label="Inspector"></div>
        <div class="insp-body" id="insp-body"></div>
        <form class="composer m-instruct" id="composer" aria-label="Composer: instruct the loop, act or ask">
          <div class="cp-band" id="cp-band"></div>
          <div class="cp-seg" id="cp-seg" role="tablist" aria-label="Intent"></div>
          <div class="cp-why" id="cp-why" hidden></div>
          <div class="cp-act" id="cp-act" hidden></div>
          <label class="cp-feat" id="cp-feat" for="cp-feature"><span>about the feature:</span><select id="cp-feature"></select></label>
          <div class="cp-tray" id="cp-tray" hidden></div>
          <div class="cp-box">
            <textarea id="cp-text" rows="2" aria-label="Message"></textarea>
            <button type="submit" class="btn btn-primary" id="cp-send">Instruct the loop</button>
          </div>
          <div class="cp-hint mono" id="cp-hint"></div>
          <div class="cp-status" id="cp-status" role="status" hidden></div>
        </form>
      </aside>
    </main>

    <div class="sep sep-h" id="sep-foot" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Timeline height" title="drag, use the arrows or double-click to restore"></div>
    <footer class="footer" id="footer">
      <div class="footer-title">
        <div class="strong">Turns</div>
        <div class="mono dim-sm">● = latest turn (live)</div>
      </div>
      <div class="timeline" id="timeline" role="group" aria-label="Loop turns"></div>
    </footer>

    <div id="idle-note" class="idle-note mono"></div>
    <div id="closed" class="closed" hidden></div>
  </div>
</template>

<script type="module" src="/static/src/main.js"></script>
</body>
</html>
